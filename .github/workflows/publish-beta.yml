name: Publish release to Discord

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Discord에 업로드 (해제하면 빌드 파일만 생성)'
        type: boolean
        default: false
      verify_channel:
        description: '게시 없이 Discord 연결 채널 확인'
        type: boolean
        default: false
      patch_notes:
        description: 'Discord에 함께 올릴 패치노트'
        type: string
        required: false

permissions:
  contents: read

jobs:
  beta:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETA_HTML: standalone/sword-master.html
    steps:
      - name: Verify the Discord destination
        if: github.event_name == 'push' || inputs.publish || inputs.verify_channel
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ ! "$DISCORD_WEBHOOK_URL" =~ ^https://discord\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+$ ]]; then
            echo 'Set DISCORD_WEBHOOK_URL to the Discord channel webhook URL.'
            exit 1
          fi
          webhook=$(curl --fail --silent --show-error --max-time 15 "$DISCORD_WEBHOOK_URL")
          channel_id=$(jq -er '.channel_id | select(type == "string" and test("^[0-9]+$"))' <<< "$webhook")
          # Fingerprint of the confirmed Discord channel ID.
          expected=6f8e09008e00e4603948aa46996ab197d6966ad91f35b8719eed8bfb0fbf0055
          actual=$(printf '%s' "$channel_id" | sha256sum | cut -d ' ' -f 1)
          if [[ "$actual" != "$expected" ]]; then
            echo 'Discord webhook points to a different channel. Update DISCORD_WEBHOOK_URL before publishing.'
            exit 1
          fi
          echo 'Discord webhook points to the confirmed channel.'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Verify game
        run: |
          npm test
          npm run typecheck
      - name: Build student HTML
        run: |
          rm -f "$BETA_HTML"
          npm run build:single
          test -s "$BETA_HTML"
      - name: Prepare the Discord HTML attachment
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { gzipSync } from 'node:zlib';

          const file = process.env.BETA_HTML;
          const limit = 20 * 1024 * 1024;
          const original = readFileSync(file);
          if (original.length <= limit) {
            console.log(`Standalone HTML: ${original.length} bytes`);
            process.exit(0);
          }

          const data = gzipSync(original, { level: 9 }).toString('base64');
          const html = `<!doctype html>
          <html lang="ko">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>S’word Master</title>
          <p id="status">게임을 여는 중…</p>
          <noscript>게임을 열려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
          <script id="game" type="application/octet-stream">${data}</script>
          <script>
          window.addEventListener('load', async () => {
            try {
              const data = document.getElementById('game').textContent;
              const bytes = Uint8Array.from(atob(data), char => char.charCodeAt(0));
              const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
              const html = await new Response(stream).text();
              document.open();
              document.write(html);
              document.close();
            } catch (error) {
              const status = document.getElementById('status');
              if (status) status.textContent = '게임을 열지 못했어요. 최신 브라우저에서 다시 열어주세요.';
              console.error(error);
            }
          }, { once: true });
          </script>
          </html>`;
          const size = Buffer.byteLength(html);
          writeFileSync(file, size < original.length ? html : original);
          console.log(`Standalone HTML: ${Math.min(size, original.length)} bytes (source: ${original.length})`);
          JS
      - name: Verify the downloadable HTML
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { chromium } from 'playwright';

          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            await page.route(/^https?:\/\//, route => route.abort());
            const fileUrl = pathToFileURL(resolve(process.env.BETA_HTML)).href;
            await page.goto(fileUrl);
            await page.locator('#root button:visible').first().waitFor({ timeout: 30_000 });
            console.log('The game opened directly from the HTML file with web requests blocked.');
          } finally {
            await browser.close();
          }
          JS
      - name: Save HTML for download
        id: html
        uses: actions/upload-artifact@v7
        with:
          path: standalone/sword-master.html
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Post HTML and patch notes to Discord
        if: github.event_name == 'push' || inputs.publish
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HTML_ARTIFACT_URL: ${{ steps.html.outputs.artifact-url }}
          PATCH_NOTES: ${{ inputs.patch_notes }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version=${GITHUB_REF_NAME#v}
          fi
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT

          post() {
            local instructions="$1" file="${2:-}" mime="${3:-}" message payload
            local -a attachment=()
            if [[ -n "$file" ]]; then
              attachment=(--form "files[0]=@$file;type=$mime")
            fi
            message="S’word Master 정식 업데이트 v$version"$'\n'"$instructions"
            if [[ -n "$PATCH_NOTES" ]]; then
              message+=$'\n\n'"$PATCH_NOTES"
            fi
            if (( ${#message} > 2000 )); then
              echo 'Shorten the patch notes so the Discord message is at most 2,000 characters.' >&2
              exit 1
            fi
            payload=$(jq -cn --arg content "$message" '{content: $content, allowed_mentions: {parse: []}}')
            status=$(curl --silent --show-error --max-time 90 --output "$response" \
              --write-out '%{http_code}' --form-string "payload_json=$payload" \
              "${attachment[@]}" "${DISCORD_WEBHOOK_URL}?wait=true")
          }

          too_large() {
            [[ "$status" == 413 ]] || jq -e '.code == 40005' "$response" >/dev/null 2>&1
          }

          confirm_post() {
            local expected="${1:-}"
            if [[ "$status" != 200 ]] || ! jq -e --arg name "$expected" \
              '.id and .channel_id and ($name == "" or any(.attachments[]?; .filename == $name))' "$response" >/dev/null; then
              echo "Discord did not confirm the post (HTTP $status)."
              exit 1
            fi
            jq -r '"Discord confirmed message \(.id)."' "$response"
          }

          post 'HTML 파일을 다운로드한 뒤 브라우저로 열어주세요.' "$BETA_HTML" text/html
          if ! too_large; then
            confirm_post "${BETA_HTML##*/}"
            exit 0
          fi

          post "[학생용 HTML 다운로드]($HTML_ARTIFACT_URL) (GitHub 로그인 필요, 7일간 다운로드 가능)"
          confirm_post
          echo 'Discord accepted the download link after rejecting the HTML attachment.'
